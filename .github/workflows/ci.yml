name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Demo (compiles all library sources)
        run: >-
          xcodebuild -scheme vconsole -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          build

      - name: Run unit tests
        run: bash Tests/run_tests.sh
